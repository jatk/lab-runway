<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lab Runway</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EDF1EC; --surface:#FBFCFA; --sunk:#E3E9E3; --ink:#17262B; --muted:#5B6B6E; --line:#D0D9D2;
  --primary:#0E5A57; --primary-ink:#FFFFFF; --warn:#9A620B; --bad:#B0382C; --good:#2E7A3E;
  --display:"Bricolage Grotesque", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --body:"Manrope", "Segoe UI", system-ui, -apple-system, sans-serif;
  color-scheme: light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0F1719; --surface:#162123; --sunk:#1D2B2D; --ink:#E4ECEA; --muted:#93A4A6; --line:#2B3B3D;
    --primary:#5FC2BC; --primary-ink:#06201F; --warn:#E3A84A; --bad:#EE7A6C; --good:#7CCB8C;
    color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0F1719; --surface:#162123; --sunk:#1D2B2D; --ink:#E4ECEA; --muted:#93A4A6; --line:#2B3B3D;
  --primary:#5FC2BC; --primary-ink:#06201F; --warn:#E3A84A; --bad:#EE7A6C; --good:#7CCB8C;
  color-scheme: dark;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 var(--body);font-variant-numeric:tabular-nums}
h1,h2,h3{font-family:var(--display);font-weight:700;margin:0;letter-spacing:-.01em}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--primary);outline-offset:2px}
a{color:var(--primary)}

.top{display:flex;flex-wrap:wrap;gap:12px 20px;align-items:center;justify-content:space-between;padding:18px clamp(14px,3vw,32px) 0}
.brand{display:flex;align-items:baseline;gap:12px;min-width:0}
.brand h1{font-size:1.35rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand .app{color:var(--muted);font-size:.85rem}
.top-right{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.status{font-size:.8rem;color:var(--muted)}
.switch{display:flex;align-items:center;gap:8px;font-size:.88rem;cursor:pointer;user-select:none}
.switch input{appearance:none;width:34px;height:20px;border-radius:20px;background:var(--line);position:relative;cursor:pointer;margin:0;transition:background .15s}
.switch input::after{content:"";position:absolute;top:3px;left:3px;width:14px;height:14px;border-radius:50%;background:var(--surface);transition:transform .15s}
.switch input:checked{background:var(--primary)}
.switch input:checked::after{transform:translateX(14px)}

nav.tabs{display:flex;gap:4px;padding:14px clamp(14px,3vw,32px) 0;border-bottom:1px solid var(--line);overflow-x:auto}
nav.tabs a{padding:8px 14px;border-radius:8px 8px 0 0;text-decoration:none;color:var(--muted);font-weight:600;white-space:nowrap;border:1px solid transparent;border-bottom:none;margin-bottom:-1px}
nav.tabs a[aria-current="page"]{color:var(--ink);background:var(--surface);border-color:var(--line)}
main{padding:24px clamp(14px,3vw,32px) 48px;max-width:1280px}

.btn{border:1px solid var(--line);background:var(--surface);padding:7px 14px;border-radius:7px;cursor:pointer;font-weight:600;font-size:.9rem}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--primary);color:var(--primary-ink);border-color:var(--primary)}
.btn.danger{color:var(--bad)}
.btn.small{padding:4px 10px;font-size:.82rem}
.btn:disabled{opacity:.4;cursor:default;border-color:var(--line)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.spacer{flex:1}

.hero{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:28px;align-items:end;margin-bottom:28px}
.hero .lead{font-size:.95rem;color:var(--muted);margin:0 0 4px}
.hero .big{font-family:var(--display);font-size:clamp(2.6rem,7vw,4.6rem);line-height:.95;font-weight:700;letter-spacing:-.03em}
.hero .big.bad{color:var(--bad)}
.hero .sub{margin:12px 0 0;max-width:52ch}
.figs{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.fig{background:var(--surface);padding:12px 14px}
.fig b{display:block;font-size:1.25rem;font-family:var(--display)}
.fig span{font-size:.8rem;color:var(--muted)}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:18px;margin-bottom:22px}
.panel h2{font-size:1.1rem;margin-bottom:4px}
.panel .hint{color:var(--muted);font-size:.86rem;margin:0 0 12px}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:.84rem;margin:6px 0 4px}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.chartrow{display:flex;align-items:flex-start}
.yaxcol{flex:0 0 auto;width:0;position:relative;z-index:2;pointer-events:none}
.yaxcol svg{position:absolute;left:0;top:0;background:linear-gradient(to right,var(--surface) 80%,transparent)}
.chartwrap{position:relative;overflow-x:auto;flex:1;min-width:0}
.chartwrap svg{display:block;width:100%;min-width:620px;height:auto}
.tip{position:absolute;pointer-events:none;background:var(--ink);color:var(--bg);font-size:.8rem;padding:8px 10px;border-radius:7px;min-width:180px;display:none;z-index:2}
.tip div{display:flex;justify-content:space-between;gap:14px}
.tip .neg{color:#FFB3A8}
.tip .tsec{display:block;margin-top:7px;padding-top:5px;border-top:1px solid color-mix(in srgb,var(--bg) 25%,transparent);opacity:.7;font-size:.7rem;text-transform:uppercase;letter-spacing:.05em}

.alerts{list-style:none;margin:0;padding:0}
.alerts li{display:grid;grid-template-columns:10px 1fr;gap:12px;padding:10px 0;border-top:1px solid var(--line)}
.alerts li:first-child{border-top:none}
.alerts .dot{width:10px;height:10px;border-radius:50%;margin-top:6px}
.alerts .bad .dot{background:var(--bad)} .alerts .warn .dot{background:var(--warn)} .alerts .info .dot{background:var(--muted)} .alerts .good .dot{background:var(--good)}
.alerts small{color:var(--muted)}

.tbl-wrap{overflow-x:auto}
table.data{width:100%;border-collapse:collapse;font-size:.9rem}
table.data th{text-align:left;font-weight:600;color:var(--muted);font-size:.8rem;padding:6px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
table.data td{padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:top}
table.data td.num,table.data th.num{text-align:right;white-space:nowrap}
table.data tr.click{cursor:pointer}
table.data tr.click:hover td{background:var(--sunk)}
table.data tfoot td{font-weight:700;border-bottom:none}
.neg{color:var(--bad)} .warnc{color:var(--warn)} .muted{color:var(--muted)}
.sw{display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:8px;vertical-align:-1px}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:.78rem;border:1px solid var(--line);border-radius:20px;padding:1px 8px 1px 6px;margin:0 4px 3px 0;white-space:nowrap}
.chip i{width:8px;height:8px;border-radius:50%}
.tag{font-size:.74rem;border-radius:4px;padding:1px 6px;background:var(--sunk);color:var(--muted);white-space:nowrap}
.tag.pending{background:color-mix(in srgb,var(--warn) 18%,transparent);color:var(--warn)}

/* funding map */
.map{border-collapse:separate;border-spacing:0;font-size:.78rem}
.map th,.map td{padding:0}
.map .lab{position:sticky;left:0;background:var(--surface);z-index:1;min-width:190px;max-width:220px;padding:0 12px 0 0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;height:26px;font-size:.85rem}
.map .lab.grp{color:var(--muted);font-size:.78rem;padding-top:12px;height:34px;vertical-align:bottom}
.map .yr{font-weight:700;text-align:left;padding:0 0 2px 3px;border-left:1px solid var(--muted);font-size:.78rem}
.map .mo{color:var(--muted);text-align:center;font-weight:500;font-size:.66rem;width:16px;min-width:16px}
.map td.c{width:16px;min-width:16px;height:24px;border-right:1px solid var(--surface);border-bottom:2px solid var(--surface)}
.map td.c.ys{box-shadow:inset 1px 0 0 var(--muted)}
.map tr.exp{cursor:pointer}
.map tr.exp:hover .lab{color:var(--primary)}
.map td.c.over{outline:2px solid var(--warn);outline-offset:-2px}
.hatch{background:repeating-linear-gradient(135deg,var(--bad) 0 3px,color-mix(in srgb,var(--bad) 35%,transparent) 3px 6px) !important}
.map td.c.today{box-shadow:inset 2px 0 0 var(--ink)}
.map td.c.pastc{opacity:.5}
.map tr[hidden]{display:none}
.map .lab.grp{z-index:2}
.map td.grpfill{border-bottom:1px solid var(--line)}
.caret{border:none;background:none;padding:0;cursor:pointer;color:inherit;font:inherit;display:inline-flex;gap:6px;align-items:center;max-width:100%}
.caret .car{display:inline-block;font-size:.7rem;transition:transform .15s;color:var(--muted)}
.caret[aria-expanded="true"] .car{transform:rotate(90deg)}
.caret .cnt{font-size:.72rem;border:1px solid var(--line);border-radius:10px;padding:0 6px}
.caret:hover{color:var(--ink)}
.felcard{border:1px solid var(--line);border-radius:8px;padding:12px;margin:-2px 0 10px;background:var(--sunk)}
.felrow{background:var(--sunk);border-radius:6px;padding:4px 0 4px 6px}
.felrow .fname{display:flex;gap:8px;align-items:center;border:none;background:none;padding:0;cursor:pointer;text-align:left;min-width:0}
.felrow .fname span{display:flex;flex-direction:column;min-width:0}
.felrow .fname b{font-size:.88rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.felrow .fname small{color:var(--muted);font-size:.76rem}
.felrow .fd{font-size:.84rem;color:var(--muted)}
.pctw{display:flex;align-items:center;gap:3px}
.pctw span{color:var(--muted);font-size:.84rem}
.mono{font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace;letter-spacing:.01em}
.sublabel{font-size:.82rem;font-weight:700;color:var(--muted);margin:14px 0 6px;text-transform:uppercase;letter-spacing:.04em}
.cs-wrap{position:relative}
.cs-c i.sel{outline:2px solid var(--primary);outline-offset:1px;position:relative;z-index:1}
.fixp{border:1px solid var(--line);background:var(--sunk);border-radius:8px;padding:10px 12px;margin:10px 0 6px}
.fxrow{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr) 86px;gap:12px;align-items:center;padding:5px 0;border-top:1px solid var(--line)}
.fxrow:first-of-type{border-top:none}
.fxname{display:flex;flex-direction:column;font-size:.88rem;min-width:0}
.fxname > span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fxname small{font-size:.74rem}
.fxrow input[type=range]{width:100%;accent-color:var(--primary)}
.fxrow input[type=number]{background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:5px 7px;color:var(--ink);width:62px;font-size:.88rem}
@media (max-width:820px){.fxrow{grid-template-columns:1fr 86px}.fxrow input[type=range]{grid-column:1/-1;order:3}}
.covstrip{overflow-x:auto;margin:6px 0 2px;padding-bottom:6px}
.cs-y,.cs-m,.cs-c{display:flex;gap:2px;min-width:min-content}
.covstrip[data-z="fit"] .cs-y span,.covstrip[data-z="fit"] .cs-c i{flex:1 0 8px}
.covstrip[data-z="px"] .cs-y span,.covstrip[data-z="px"] .cs-m span,.covstrip[data-z="px"] .cs-c i{flex:0 0 var(--cw)}
.cs-y span{font-size:.74rem;font-weight:600;color:var(--muted);white-space:nowrap;height:17px;overflow:visible;width:0}
.cs-m span{font-size:.64rem;color:var(--muted);text-align:center;height:15px;overflow:hidden}
.cs-c i{height:48px;border-radius:3px;display:block;cursor:pointer}
.cs-c i.ys{box-shadow:inset 2px 0 0 var(--muted)}
.cs-c i.now{box-shadow:inset 3px 0 0 var(--ink)}
.cs-c i.over{outline:2px solid var(--warn);outline-offset:-2px}
.cs-c i.hl{outline:2px solid var(--ink);outline-offset:1px;position:relative;z-index:1}
.cs-tip{position:absolute;z-index:5;display:none;pointer-events:none;background:var(--ink);color:var(--bg);font-size:.8rem;padding:8px 10px;border-radius:7px;min-width:230px;max-width:340px;box-shadow:0 6px 18px rgba(0,0,0,.22)}
.cs-tip .h{display:flex;justify-content:space-between;gap:12px;margin-bottom:5px}
.cs-tip .r{display:grid;grid-template-columns:10px minmax(0,1fr) auto 34px;gap:7px;align-items:center;padding:1px 0}
.cs-tip .r span:nth-child(2){overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cs-tip .pc{opacity:.7;text-align:right}
.cs-tip i{width:10px;height:10px;border-radius:2px}
.cs-tip .gap{color:#FFB3A8}
.seg button:disabled{opacity:.4;cursor:default}
.tag.st-cur{background:color-mix(in srgb,var(--good) 16%,transparent);color:var(--good)}
.tag.st-up{background:color-mix(in srgb,var(--primary) 14%,transparent);color:var(--primary)}
.cov{display:flex;flex-wrap:wrap;gap:6px 12px;align-items:center;justify-content:space-between;padding:8px 10px;border-radius:6px;margin-top:6px;font-size:.86rem}
.cov small{display:block;color:var(--muted)}
.cov.ok{background:color-mix(in srgb,var(--good) 12%,transparent);color:var(--good)}
.cov.gap{background:color-mix(in srgb,var(--bad) 10%,transparent)}
.cov.gap b{color:var(--bad)}
.cov.over{background:color-mix(in srgb,var(--warn) 14%,transparent)}
.comp{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:28px;margin-top:16px}
.comp h3{font-size:1rem}
.pie{display:flex;gap:18px;align-items:center;flex-wrap:wrap}
.donut{width:170px;height:170px;flex:none}
.pleg{flex:1;min-width:190px;font-size:.85rem}
.pleg div{display:grid;grid-template-columns:12px minmax(0,1fr) auto 56px;gap:8px;align-items:center;padding:3px 0}
.pleg i{width:12px;height:12px;border-radius:3px}
.pleg span:nth-child(2){overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pleg .muted{text-align:right}
.yearbars{display:flex;gap:8px;align-items:flex-end;margin-top:16px;overflow-x:auto;padding:4px 2px}
.yb{border:none;background:none;cursor:pointer;padding:0;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:.74rem;color:var(--muted)}
.yb .bar{width:28px;height:64px;display:flex;flex-direction:column;border-radius:4px;overflow:hidden;background:var(--sunk)}
.yb .bar i{display:block;min-height:1px}
.yb[aria-pressed="true"]{color:var(--ink);font-weight:700}
.yb[aria-pressed="true"] .bar{outline:2px solid var(--ink);outline-offset:2px}
@media (max-width:820px){.comp{grid-template-columns:1fr}}
#fywrap .pastcol{opacity:.55}
#fywrap .nowcol{box-shadow:inset 2px 0 0 var(--primary)}
#fywrap td:first-child,#fywrap th:first-child{position:sticky;left:0;background:var(--surface);z-index:1}
.map td.c.proj,.map th.projstart{box-shadow:inset 2px 0 0 var(--primary)}

/* forms */
dialog{border:1px solid var(--line);border-radius:12px;background:var(--surface);color:var(--ink);padding:0;width:min(640px,94vw);max-height:90vh}
dialog.wide{width:min(1040px,96vw)}
dialog::backdrop{background:rgba(10,20,22,.45)}
.dlg-h{padding:18px 20px 6px}
.dlg-b{padding:8px 20px 4px;overflow:auto;max-height:calc(90vh - 140px)}
.dlg-f{padding:14px 20px 18px;display:flex;gap:10px;flex-wrap:wrap;align-items:center;border-top:1px solid var(--line)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px 14px}
.full{grid-column:1/-1}
label.f{display:flex;flex-direction:column;gap:4px;font-size:.82rem;font-weight:600;color:var(--muted)}
label.f input,label.f select,label.f textarea,.alloc input,.alloc select{background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:7px 9px;color:var(--ink);font-weight:500;font-size:.92rem;min-width:0;width:100%}
label.f input[type=color]{padding:2px;height:36px}
.alloc{display:grid;grid-template-columns:minmax(0,2fr) 76px minmax(0,1.2fr) minmax(0,1.2fr) 30px;gap:6px;align-items:center;margin-bottom:6px}
.alloc.h{font-size:.74rem;color:var(--muted);font-weight:600}
.x{border:none;background:none;cursor:pointer;color:var(--muted);font-size:1.1rem;line-height:1}
.allocsum{font-size:.84rem;margin:4px 0 0}
.err{color:var(--bad);font-size:.85rem;min-height:1.2em}

.banner{margin:16px clamp(14px,3vw,32px) 0;padding:12px 16px;border-radius:10px;display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;background:color-mix(in srgb,var(--warn) 16%,var(--surface));border:1px solid color-mix(in srgb,var(--warn) 45%,transparent)}
.banner.roll{background:var(--surface);border-color:var(--line);margin:0 0 20px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:7px;overflow:hidden}
.seg button{border:none;background:var(--surface);padding:4px 10px;font-size:.82rem;cursor:pointer;color:var(--muted);font-weight:600}
.seg button[aria-pressed="true"]{background:var(--primary);color:var(--primary-ink)}
.viewing #gAdd,.viewing #cAdd,.viewing #mAddCost,.viewing #mAddGrant{display:none}
input.txt{background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:7px 9px;color:var(--ink);font-size:.92rem}
input[type=range]{accent-color:var(--primary)}
.peek-h{display:flex;flex-wrap:wrap;gap:6px 16px;align-items:baseline;margin:12px 0 6px}
.peek-h b{font-family:var(--display);font-size:1.15rem}
.empty{text-align:left;padding:48px 0;max-width:560px}
.empty h2{font-size:clamp(1.8rem,4vw,2.6rem);margin-bottom:10px;line-height:1.05}
.empty p{color:var(--muted)}

@media (max-width:820px){
  .hero{grid-template-columns:1fr}
  .grid2{grid-template-columns:1fr}
  .alloc{grid-template-columns:1fr 70px 30px}
  .alloc .am{grid-column:1/3}
  .alloc.h{display:none}
}
@media (prefers-reduced-motion:reduce){*{transition:none !important}}
</style>
</head>
<body>
<header class="top">
  <div class="brand"><h1 id="labName">Lab</h1><span class="app">Lab Runway</span></div>
  <div class="top-right">
    <label class="switch" title="Include grants marked pending in the projection"><input type="checkbox" id="pendingToggle"> Count pending grants</label>
    <span class="status" id="saveStatus">Loading…</span>
  </div>
</header>
<nav class="tabs" id="tabs">
  <a href="#overview">Overview</a>
  <a href="#map">Funding map</a>
  <a href="#grants">Support</a>
  <a href="#costs">Costs</a>
  <a href="#history">History</a>
  <a href="#setup">Setup</a>
</nav>
<div id="banner"></div>
<main id="view"></main>
<dialog id="dlg"></dialog>

<script>
"use strict";
/* ---------- helpers ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const uid = () => Math.random().toString(36).slice(2, 10);
const MN = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
const toIdx = m => { const [y, mo] = m.split("-").map(Number); return y * 12 + mo - 1; };
const toM = i => `${Math.floor(i / 12)}-${String(i % 12 + 1).padStart(2, "0")}`;
const lbl = i => MN[((i % 12) + 12) % 12] + " " + Math.floor(i / 12);
const validM = m => /^\d{4}-(0[1-9]|1[0-2])$/.test(m || "");
const nowM = () => { const d = new Date(); return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}`; };
const num = v => { const n = parseFloat(v); return isFinite(n) ? n : 0; };
const PALETTE = ["#0F7A73","#3D5BA9","#C0661C","#8A4FB0","#2E8B3E","#B23A63","#7A861E","#C9920F","#2C7FB8","#8C5A3C"];

let NF, NFc;
function setFmt() {
  const c = state.settings.currency || "USD";
  try {
    NF = new Intl.NumberFormat(undefined, {style:"currency", currency:c, maximumFractionDigits:0});
    NFc = new Intl.NumberFormat(undefined, {style:"currency", currency:c, notation:"compact", maximumFractionDigits:1});
  } catch (e) {
    NF = new Intl.NumberFormat(undefined, {maximumFractionDigits:0}); NFc = NF;
  }
}
const fmt = n => NF.format(Math.round(n));
const fmtc = n => NFc.format(n);

/* ---------- state ---------- */
function blank() {

// The example lab as it stood at the start of month mi: spending since 2024 (with some month-to-month variation) recorded as spent.
function exampleAt(base, mi) {
  const t0 = toIdx(EX_T0), st = JSON.parse(JSON.stringify(base)), n = Math.max(0, mi - t0);
  if (n > 0) {
    const run = JSON.parse(JSON.stringify(base));
    run.settings.start = EX_T0; run.settings.years = Math.ceil(n / 12) + 1; run.settings.includePending = false; run._noAuto = true;
    const P = project(run);
    P.gs.forEach((G, gi) => {

      for (let k = 0; k < n && k < P.N; k++) tot += G.spend[k] * (1 + 0.12 * Math.sin(k * 1.7 + gi * 2.3));
      st.grants[gi].spent = Math.round(tot);

}

/* ---------- projection engine ---------- */
function project(st) {
  const S = toIdx(validM(st.settings.start) ? st.settings.start : nowM());
  const N = Math.max(12, Math.min(180, Math.round(num(st.settings.years) * 12) || 60));
  const gs = st.grants.map(g => {
    const s = validM(g.start) ? toIdx(g.start) : S, e = validM(g.end) ? toIdx(g.end) : S + N;
    return {g, s, e, on: g.status === "active" || (g.status === "pending" && st.settings.includePending),
      avail: num(g.amount) - num(g.spent), spentEff: num(g.spent), auto: false, spend: new Array(N).fill(0), bal: new Array(N).fill(0),
      dir: new Array(N).fill(0), idc: new Array(N).fill(0), rate: g.untracked ? 0 : num(g.idcRate) / 100, base: g.untracked ? "none" : (g.idcBase || "none"), incl: !g.untracked && g.awardBasis === "total", unl: !!g.untracked};
  });
  const gm = Object.fromEntries(gs.map(x => [x.g.id, x]));
  // A grant whose "spent before the projection starts" is left blank takes its spending to date from the plan.
  if (!st._noAuto) {
    const need = gs.filter(G => !(num(G.g.spent) > 0) && G.s < S);
    if (need.length) {
      const first = Math.max(S - 179, Math.min(...need.map(G => G.s)));
      const run = JSON.parse(JSON.stringify(st)); run._noAuto = true;
      run.settings.start = toM(first); run.settings.years = Math.max(1, Math.ceil((S - first) / 12));
      const PP = project(run);
      need.forEach(G => {
        const PG = PP.gm[G.g.id]; if (!PG) return;
        let sp = 0; for (let k = 0; k < S - first && k < PP.N; k++) sp += PG.spend[k];
        G.spentEff = sp; G.auto = true; G.avail = num(G.g.amount) - sp;
      });
    }
  }
  const unfunded = new Array(N).fill(0), total = new Array(N).fill(0), idcAll = new Array(N).fill(0);
  const rows = st.expenses.map(ex => {
    const es = validM(ex.start) ? toIdx(ex.start) : S;
    const ee = ex.kind === "once" ? es : (validM(ex.end) ? toIdx(ex.end) : S + N);
    const cells = new Array(N).fill(null);
    let gap = 0, gapFirst = null, gapLast = null, over = false, horizonCost = 0, idcTot = 0;
    const exempt = isExempt(ex);
    for (let k = 0; k < N; k++) {
      const mi = S + k;
      if (mi < es || mi > ee) continue;
      const yrs = Math.floor((mi - es) / 12);
      const cost = num(ex.amount) * Math.pow(1 + num(ex.raise) / 100, yrs) * (1 + num(ex.fringe) / 100);
      let left = cost, cellIdc = 0; const parts = [];
      const activeA = (ex.alloc || []).filter(a => {
        const as = validM(a.start) ? toIdx(a.start) : -Infinity, ae = validM(a.end) ? toIdx(a.end) : Infinity;
        return mi >= as && mi <= ae;
      });
      const charge = (a, amt) => {
        const G = gm[a.grantId];
        if (amt <= 0 || !(G && G.on && mi >= G.s && mi <= G.e)) return 0;
        const idc = G.base === "none" || (G.base === "mtdc" && exempt) ? 0 : amt * G.rate;
        G.dir[k] += amt; G.idc[k] += idc; G.spend[k] += amt + (G.incl ? idc : 0);
        parts.push({gid:a.grantId, amt, idc}); left -= amt; cellIdc += idc;
        return amt;
      };
      // Fellowships paying a percentage or a fixed monthly amount come off first; other sources split what's left.
      let covered = 0, salLeft = cost / (1 + num(ex.fringe) / 100);
      for (const a of activeA) {
        const g = gm[a.grantId] && gm[a.grantId].g;
        if (!fellowFixed(g)) continue;
        // A fellowship that doesn't cover fringe can only pay toward the salary part of the cost.
        const totLeft = cost - covered, base = g.coversFringe === false ? salLeft : totLeft;
        const want = g.fellowMode === "monthly" ? num(g.fellowMonthly) : base * fellowPctOf(g, a) / 100;
        const paid = charge(a, Math.min(want, base));
        salLeft -= g.coversFringe === false ? paid : (totLeft > 0 ? paid * salLeft / totLeft : 0);
        covered += paid;
      }
      const rest = cost - covered;
      for (const a of activeA) { if (!fellowFixed(gm[a.grantId] && gm[a.grantId].g)) charge(a, rest * num(a.pct) / 100); }
      const isOver = left < -0.5;
      if (left > 0.5) { unfunded[k] += left; parts.push({gid:null, amt:left}); gap += left; if (gapFirst === null) gapFirst = mi; gapLast = mi; }
      if (isOver) over = true;
      total[k] += cost; horizonCost += cost; idcAll[k] += cellIdc; idcTot += cellIdc;
      cells[k] = {cost, parts, over:isOver, idc:cellIdc};
    }
    return {ex, cells, gap, gapFirst, gapLast, over, horizonCost, idcTot};
  });
  const deptAll = new Array(N).fill(0), fellowAll = new Array(N).fill(0);
  for (const G of gs) {
    if (G.unl) { G.avail = 0; const tgt = G.g.type === "Fellowship" ? fellowAll : deptAll; if (G.on) G.dir.forEach((v, k) => tgt[k] += v); continue; }
    let b = G.avail; for (let k = 0; k < N; k++) { b -= G.spend[k]; G.bal[k] = b; }
  }
  // funded-through: first month with a gap or an overdrawn active grant
  let breakK = null;
  for (let k = 0; k < N && breakK === null; k++) {
    if (unfunded[k] > 0.5) breakK = k;
    else if (gs.some(G => G.on && G.bal[k] < -0.5 && S + k >= G.s)) breakK = k;
  }
  return {S, N, gs, gm, rows, unfunded, total, idcAll, deptAll, fellowAll, breakK};
}

function buildAlerts(P) {
  const out = [];
  // Flag grants whose "spent so far" doesn't match what the plan charged to them before the projection start.
  const PA = pastRun(P, "all");
  if (PA.PP) P.gs.forEach(G => {
    if (!G.on || G.unl || G.s >= P.S) return;
    const PG = PA.PP.gm[G.g.id]; if (!PG) return;
    let planned = 0;
    for (let mi = G.s; mi < Math.min(P.S, G.e + 1); mi++) { const k = mi - (P.S - PA.past); if (k >= 0 && k < PG.spend.length) planned += PG.spend[k]; }
    if (G.auto) return;
    const entered = num(G.g.spent);
    if (Math.abs(planned - entered) > Math.max(1000, 0.05 * num(G.g.amount)))
      out.push({lvl:"warn", t:`<b>${esc(G.g.name)}</b>: “spent so far” is ${fmt(entered)}, but the plan charges ${fmt(planned)} to it before ${lbl(P.S)}`,
        s:`Update the spent amount on the Support page from your latest statement so the balances line up. The chart’s past line follows the plan; today’s balance follows the spent amount.`});
  });
  for (const G of P.gs) {
    if (!G.on || G.unl) continue;
    const name = esc(G.g.name);
    const kNeg = G.bal.findIndex(b => b < -0.5);
    if (kNeg >= 0) {
      const lastK = Math.min(P.N - 1, G.e - P.S);
      const short = -Math.min(...G.bal.slice(0, Math.max(kNeg + 1, lastK + 1)));
      out.push({lvl:"bad", t: G.avail < -0.5 ? `<b>${name}</b> is already overdrawn by ${fmt(-G.avail)}${G.auto ? ", going by the costs charged to it so far" : ""}` : `<b>${name}</b> runs out in ${lbl(P.S + kNeg)}`,
        s:`Charges assigned to it exceed what’s left by ${fmt(short)}${G.e < P.S + P.N ? " before it ends in " + lbl(G.e) : " within the projection"}.`});
    } else if (G.e >= P.S && G.e < P.S + P.N) {
      const end = G.bal[G.e - P.S];
      if (end > Math.max(1000, 0.02 * num(G.g.amount))) out.push({lvl:"warn", t:`<b>${name}</b> ends in ${lbl(G.e)} with ${fmt(end)} unspent`, s:"Assign more costs to it before it ends, or check whether a no-cost extension or carryover is possible."});
    }
    if (G.g.status === "pending") out.push({lvl:"info", t:`<b>${name}</b> is pending (${num(G.g.prob)}% likely) and counted as funding`, s:"Turn off “Count pending grants” to see the projection without it."});
  }
  for (const r of P.rows) {
    if (r.gap > 0.5) out.push({lvl:"bad", t:`<b>${esc(r.ex.name)}</b> has no funding source for ${fmt(r.gap)}`,
      s: r.gapFirst === r.gapLast ? `In ${lbl(r.gapFirst)}.` : `Between ${lbl(r.gapFirst)} and ${lbl(r.gapLast)}.`});
    if (r.over) out.push({lvl:"warn", t:`<b>${esc(r.ex.name)}</b> is assigned more than 100% in some months`, s:"Grants are being charged more than the cost. Check its funding split."});
  }
  const order = {bad:0, warn:1, info:2};
  return out.sort((a, b) => order[a.lvl] - order[b.lvl]);
}

function sanitize(st) {
  const b = blank();
  if (!st || typeof st !== "object") return b;
  st.settings = Object.assign(b.settings, st.settings || {});
  st.grants = Array.isArray(st.grants) ? st.grants : [];
  st.expenses = Array.isArray(st.expenses) ? st.expenses : [];
  st.expenses.forEach(e => { if (!Array.isArray(e.alloc)) e.alloc = []; });
  st.grants.forEach(g => {
    if (g.type !== "Fellowship" || g.personId) return;
    const users = st.expenses.filter(e => (e.alloc || []).some(a => a.grantId === g.id));
    if (users.length === 1) { g.personId = users[0].id; if (!g.fellowTitle) g.fellowTitle = String(g.name).split(/\s[—–-]\s/)[0]; }
  });
  st.grants.forEach(g => { if (g.idcRate == null) g.idcRate = 0; if (!g.idcBase) g.idcBase = "mtdc"; if (!g.awardBasis) g.awardBasis = "direct"; });

}

const TYPES = ["Grant","Fellowship","Contract","Startup","Internal","Gift or endowment","Departmental support"];

function sortGs(gs) {

  return gs.map((G, i) => [G, i]).sort((x, y) => cmp(x, y) || x[1] - y[1]).map(x => x[0]);

const LSH = "labRunway.hist.v1", LSS = "labRunway.snap.";

function scheduleSnap() { clearTimeout(snapTimer); snapTimer = setTimeout(() => recordSnapshot("auto"), 8000); }
function firstSnap() { if (!histIndex.length && hasData(state) && !viewing) recordSnapshot("auto"); }
async function recordSnapshot(kind, note) {
  if (viewing && kind === "auto") return;
  if (kind === "auto" && !hasData(state)) return;
  const json = JSON.stringify(state), ts = Date.now();
  let entry = null;
  const last = histIndex[histIndex.length - 1];
  if (kind === "auto" && last && last.kind === "auto" && dayKey(last.ts) === dayKey(ts)) entry = last;
  if (!entry) { entry = {sid: "s" + ts.toString(36) + uid().slice(0, 4)}; histIndex.push(entry); }
  Object.assign(entry, {ts, kind, note: note || "", asOf: state.settings.start, bal: summarize(state)});
  if (state.exampleId) entry.example = state.exampleId; else delete entry.example;
  await putSnap(entry.sid, json);

function thinHistory() {
  // keep every named version; automatic ones daily for 90 days, then one per week; at most 500 in total
  const now = Date.now(), weeks = new Set(), keep = [], drop = [];
  for (let i = histIndex.length - 1; i >= 0; i--) {
    const h = histIndex[i];
    if (h.kind !== "auto" || now - h.ts < 90 * 864e5) { keep.unshift(h); continue; }
    const wk = Math.floor(h.ts / (7 * 864e5));
    if (weeks.has(wk)) drop.push(h); else { weeks.add(wk); keep.unshift(h); }
  }
  while (keep.length > 500) { const i = keep.findIndex(h => h.kind === "auto"); if (i < 0) break; drop.push(keep.splice(i, 1)[0]); }
  histIndex = keep; drop.forEach(h => dropSnap(h.sid));
}

/* ---------- routing / shell ---------- */
const VIEWS = ["overview","map","grants","costs","history","setup"];

function render() {
  const r = route();
  document.querySelectorAll("#tabs a").forEach(a => { if (a.getAttribute("href") !== "#" + r) a.removeAttribute("aria-current"); else a.setAttribute("aria-current","page"); });
  $("#labName").textContent = state.settings.labName || "My lab";
  $("#pendingToggle").checked = !!state.settings.includePending;
  document.body.classList.toggle("viewing", !!viewing);
  const bn = $("#banner");
  if (viewing) {
    bn.innerHTML = `<div class="banner"><span>Viewing your lab as it was on <b>${esc(fmtDate(viewing.ts))}</b>${viewing.note ? " — " + esc(viewing.note) : ""}. Editing is off.</span><span class="spacer"></span><button class="btn small" id="bExit">Return to today</button><button class="btn small primary" id="bRestore">Restore this version</button></div>`;
    $("#bExit").onclick = exitView; confirmBtn($("#bRestore"), "Click again to replace current data", restoreView);
  } else bn.innerHTML = "";
  const P = project(state);
  const v = $("#view");
  if (r !== "setup" && r !== "history" && !state.grants.length && !state.expenses.length) { v.innerHTML = emptyView(); bindEmpty(); return; }
  if (r === "overview") v.innerHTML = overviewView(P);
  if (r === "map") v.innerHTML = mapView(P);
  if (r === "grants") v.innerHTML = grantsView(P);
  if (r === "costs") v.innerHTML = costsView(P);
  if (r === "setup") v.innerHTML = viewing ? `<section class="panel"><p>Return to today to change settings.</p></section>` : setupView();
  if (r === "history") v.innerHTML = historyView();
  bind(r, P);
}

  syncRole();
  f("name").addEventListener("input", () => $("#allocs").querySelectorAll(".felrow").forEach(row => { const g = fels.find(x => x.id === row.dataset.fid); if (g) row.querySelector(".felname").textContent = felName(g.fellowTitle, f("name").value); }));
  $("#fAdd").onclick = () => { const g = {id:uid(), type:"Fellowship", fellowTitle:"Fellowship", funder:"", fellowMode:"monthly", fellowMonthly:"", fellowPct:100, coversFringe:true, status:"active", start:validM(f("start").value.trim()) ? f("start").value.trim() : nowM(), end:"", amount:0, spent:0, color:PALETTE[(state.grants.length + fels.length) % PALETTE.length]}; fels.push(g); open.add(g.id); drawAll(); };
  $("#aAdd").onclick = () => { alloc.push({_k:uid(), grantId:(nonFel()[0] || {}).id || "", pct:alloc.length ? 0 : 100, start:"", end:""}); drawAll(); };
  f("kind").onchange = syncKind; syncKind(); drawAll();
  const syncCur = () => {
    sumAlloc();
    const e2 = {kind:f("kind").value, amount:f("amount").value, start:f("start").value.trim(), end:f("end").value.trim(), raise:f("raise").value};
    if (e2.kind === "once" || !num(e2.amount) || !validM(e2.start)) { $("#curHint").textContent = ""; return; }
    const {cur, when} = curAmount(e2), pers = isPers();
    const lead = {current:"Current", starting:"Starting", final:"Final"}[when];
    $("#curHint").textContent = `${lead} ${pers ? "salary" : "amount"}: ${fmt(cur)} per month (${fmt(cur * 12)}/yr) before fringe, with raises counted from the start month.`;
  };
  ["amount","start","end","raise","fringe","kind","category"].forEach(n => { f(n).addEventListener("input", syncCur); f(n).addEventListener("change", syncCur); });
  syncCur();
  $("#dCancel").onclick = () => dlg.close();
  const read = () => {
    const once = f("kind").value === "once";
    const clean = alloc.filter(a => a.grantId).sort((p, q) => startKey(p) - startKey(q)).map(({_k, ...a}) => a);
    const o = {name:f("name").value.trim(), category:f("category").value, kind:once ? "once" : "monthly", amount:num(f("amount").value),
      start:f("start").value.trim(), end:once ? f("start").value.trim() : f("end").value.trim(), fringe:num(f("fringe").value), raise:once ? 0 : num(f("raise").value),
      alloc:[...fels.map(g => ({grantId:g.id, pct:0, start:"", end:""})), ...clean, ...otherFel], notes:f("notes").value, idcExempt:f("idcExempt").checked, role:f("category").value === "Personnel" ? f("role").value : ""};
    if (!o.name) return "Give the cost a name.";
    if (!validM(o.start) || !validM(o.end)) return "Enter months as YYYY-MM.";
    if (toIdx(o.end) < toIdx(o.start)) return "The end month is before the start month.";
    if (o.amount <= 0) return "Enter an amount.";
    for (const a of o.alloc) { if ((a.start && !validM(a.start)) || (a.end && !validM(a.end))) return "Funding months must be YYYY-MM or left blank."; }
    for (const g of fels) {
      const nm = `“${(g.fellowTitle || "Fellowship").trim()}”`;
      if (!(g.fellowTitle || "").trim()) return "Give each fellowship a title.";
      if (!validM(g.start)) return `Enter a start month (YYYY-MM) for ${nm}.`;
      if (g.fellowMode === "award" ? !validM(g.end) : (g.end && !validM(g.end))) return `Enter an end month (YYYY-MM) for ${nm}${g.fellowMode === "award" ? "" : ", or leave it blank"}.`;
      if (g.end && toIdx(g.end) < toIdx(g.start)) return `${nm} ends before it starts.`;
      if (g.fellowMode === "monthly" && num(g.fellowMonthly) <= 0) return `Enter the monthly amount for ${nm}.`;
      if (g.fellowMode !== "monthly" && (num(g.fellowPct ?? 100) <= 0 || num(g.fellowPct ?? 100) > 100)) return `Enter the percent of salary ${nm} covers, between 1 and 100.`;
      if (g.fellowMode === "award" && num(g.amount) <= 0) return `Enter the total award for ${nm}.`;
    }
    return o;
  };
  const applyFels = costName => {
    const keep = new Set(fels.map(g => g.id));
    const gone = state.grants.filter(g => g.type === "Fellowship" && g.personId === pid && !keep.has(g.id)).map(g => g.id);
    state.grants = state.grants.filter(g => !gone.includes(g.id));
    state.expenses.forEach(x => x.alloc = (x.alloc || []).filter(a => !gone.includes(a.grantId)));
    fels.forEach(fg => {
      const award = fg.fellowMode === "award";
      const obj = {id:fg.id, name:felName(fg.fellowTitle, costName), fellowTitle:(fg.fellowTitle || "Fellowship").trim(), funder:fg.funder || "", chartString:fg.chartString || "", type:"Fellowship",
        status:fg.status === "pending" ? "pending" : "active", prob:fg.status === "pending" ? num(fg.prob ?? 50) : 100, start:fg.start, end:fg.end || "",
        amount:award ? num(fg.amount) : 0, spent:num(fg.spent), color:fg.color || PALETTE[0], notes:fg.notes || "", idcRate:0, idcBase:"none", awardBasis:"direct",
        untracked:!award, fellowMode:fg.fellowMode || "monthly", fellowPct:num(fg.fellowPct ?? 100), fellowMonthly:num(fg.fellowMonthly), coversFringe:fg.coversFringe !== false, personId:pid};
      const ix = state.grants.findIndex(g => g.id === fg.id);
      if (ix >= 0) state.grants[ix] = obj; else state.grants.push(obj);
    });
  };
  $("#dSave").onclick = () => {
    const o = read(); if (typeof o === "string") { $("#dErr").textContent = o; return; }
    const cov = coverage();
    const short = cov ? cov.filter(c => c.unc > 0.0005).length : 0;
    if (isPers() && short && !gapAck) {
      $("#dErr").textContent = `Personnel costs need 100% funding every month, and ${short} month${short === 1 ? " is" : "s are"} short. Use “Add funding for this period” above, or click “Save with gaps” to keep them as unfunded.`;
      gapAck = true; $("#dSave").textContent = "Save with gaps"; return;
    }
    if (e) Object.assign(e, o); else state.expenses.push({id:pid, ...o});
    applyFels(o.name);
    dlg.close(); commit();
  };
  if (e) {
    $("#dDup").onclick = () => { const o = read(); if (typeof o === "string") { $("#dErr").textContent = o; return; } const c = JSON.parse(JSON.stringify(o)); c.alloc = c.alloc.filter(a => !fels.some(g => g.id === a.grantId)); state.expenses.push({...c, id:uid(), name:o.name + " (copy)"}); dlg.close(); commit(); };
    confirmBtn($("#dDel"), fels.length ? "Click again — also deletes their fellowships" : "Click again to delete", () => {
      const own = state.grants.filter(g => g.personId === e.id).map(g => g.id);
      state.grants = state.grants.filter(g => !own.includes(g.id));
      state.expenses = state.expenses.filter(x => x.id !== e.id);
      state.expenses.forEach(x => x.alloc = (x.alloc || []).filter(a => !own.includes(a.grantId)));
      dlg.close(); commit();
    });
  }
}

initStore();
</script>
</body>
</html>
